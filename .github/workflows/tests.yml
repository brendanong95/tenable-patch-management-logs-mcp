name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the collectors and most TPM logs live; 3.11 is the declared floor.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --extra dev

      - name: Unit tests
        run: uv run pytest -q

      # Runs every tool against synthetic TPM logs and asserts the results.
      # No credentials, no network - exits non-zero on any failure.
      - name: Offline end-to-end smoke test
        run: uv run python scripts/smoke_local.py
