[project]
name = "tenable-patch-management-logs-mcp"
version = "0.2.0"
description = "MCP server that digs through Tenable Patch Management (SaaS and on-prem) server and client logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brendan Ong" }]
keywords = ["mcp", "tenable", "tenable-patch-management", "patch-management", "log-analysis", "troubleshooting",
            "security-operations"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Logging",
]
dependencies = [
    "mcp==2.0.0",
    "python-dotenv==1.2.2",
    # Named time zones (Asia/Singapore) need a tz database; Windows has none.
    "tzdata==2026.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
tenable-patch-management-logs-mcp = "tenable_patch_management_logs_mcp.server:main"

[project.urls]
Homepage = "https://github.com/brendanong95/tenable-patch-management-logs-mcp"
Repository = "https://github.com/brendanong95/tenable-patch-management-logs-mcp"
Issues = "https://github.com/brendanong95/tenable-patch-management-logs-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tenable_patch_management_logs_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
